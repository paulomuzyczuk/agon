  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<style>/* cyrillic-ext (--color-bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--color-divider); flex-wrap: wrap; row-gap: 6px;\">\n    <span style=\"font-family: var(--font-heading); font-size: 20px; letter-spacing: -0.02em;\">Agon<\u002Fspan>\n    <span style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-right: auto;\">v0.1<\u002Fspan>\n    <a href=\"#foundations\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Foundations<\u002Fa>\n    <a href=\"#type\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Type<\u002Fa>\n    <a href=\"#icons\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Icons<\u002Fa>\n    <a href=\"#components\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Components<\u002Fa>\n    <a href=\"#desktop\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Desktop<\u002Fa>\n    <a href=\"#run\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Run<\u002Fa>\n    <a href=\"#mobile\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Mobile<\u002Fa>\n    <a href=\"#consult\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Consulting<\u002Fa>\n    <a href=\"#email\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Email<\u002Fa>\n    <a href=\"#telegram\" style=\"font-size: 13px; color: inherit; text-decoration: none;\">Telegram<\u002Fa>\n  <\u002Fdiv>\n\n  <header style=\"max-width: 1360px; margin: 0 auto; padding: 72px 40px 40px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: end;\">\n    <div>\n      <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 18px;\">Personal performance tracking · Berlin<\u002Fdiv>\n      <h1 style=\"font-size: 76px; line-height: 0.98; letter-spacing: -0.03em; margin: 0 0 20px; max-width: 12ch;\">Agon<\u002Fh1>\n      <p style=\"font-size: 20px; line-height: 1.45; max-width: 46ch; margin: 0 0 18px; text-wrap: pretty;\">Your body, logged. Your progress, earned.<\u002Fp>\n      <p style=\"font-size: 15px; line-height: 1.6; max-width: 60ch; opacity: 0.75; text-wrap: pretty;\">A product layer over the Organic system: a warm ground and a display voice inherited unchanged, plus what a single-athlete data platform needs and Organic does not carry — a dense analytical grid, a five-zone heart-rate scale, a traffic-light status language folded into the terracotta and sage ramps, and a dark ground for the phone at 06:00.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px;\">\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 18px 20px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Block<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1;\">3<\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6;\">Peak · CW31<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 18px 20px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Week<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1;\">19<\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6;\">of 24<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #1c1916; color: #f3e8d6; border-radius: 28px; padding: 18px 20px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Volume<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1; color: #f6a06b;\">44,8<\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6;\">km this week<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #1c1916; color: #f3e8d6; border-radius: 28px; padding: 18px 20px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">TSB<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 40px; line-height: 1; color: #aebf92;\">−7<\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6;\">productive<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"foundations\" style=\"max-width: 1360px; margin: 0 auto; padding: 64px 40px 0; scroll-margin-top: 96px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-top: 2px solid var(--color-text); padding-top: 16px; margin-bottom: 40px;\">\n      <h2 style=\"font-size: 34px; margin: 0;\">Foundations<\u002Fh2>\n      <p style=\"margin: 0; font-size: 14px; opacity: 0.6; max-width: 52ch;\">What Agon adds to Organic. Everything else — type, spacing, radii, elevation — is inherited untouched.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin-bottom: 48px;\">\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Ground — light<\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">Desktop analysis. Inherited from Organic; surfaces carry the data.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;\">\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #f5ead8;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">bg<br><span style=\"opacity: 0.55;\">#f5ead8<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #ebddc5;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">surface<br><span style=\"opacity: 0.55;\">#ebddc5<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #f9f4ed;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">raised<br><span style=\"opacity: 0.55;\">neutral-100<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #201e1d;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">text<br><span style=\"opacity: 0.55;\">#201e1d<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Ground — dark <span style=\"font-family: var(--font-body); font-size: 10px; letter-spacing: 0.1em; color: var(--color-accent);\">NEW · MOBILE PRIMARY<\u002Fspan><\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">Warm near-black, not grey. Same hue family as the cream, dropped in lightness.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;\">\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #14120f;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">bg<br><span style=\"opacity: 0.55;\">#14120f<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #1c1916;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">surface<br><span style=\"opacity: 0.55;\">#1c1916<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #2a251e;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">raised<br><span style=\"opacity: 0.55;\">#2a251e<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius: 20px; overflow: hidden; border: 1px solid var(--color-divider);\">\n            <div style=\"height: 68px; background: #f3e8d6;\"><\u002Fdiv>\n            <div style=\"padding: 8px 10px; font-size: 11px;\">text<br><span style=\"opacity: 0.55;\">#f3e8d6<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; margin-bottom: 48px;\">\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Status — traffic light, warmed<\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">Green is Organic's sage. Amber is the terracotta accent. Red is the one new ramp — built on the same OKLCH lightness scale so it sits at the same visual weight as the others.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px;\">\n            <span style=\"font-size: 12px;\">good · sage<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(9, 1fr); height: 34px; border-radius: 999px; overflow: hidden;\">\n              <div style=\"background: #f0fae1;\"><\u002Fdiv><div style=\"background: #e1eecc;\"><\u002Fdiv><div style=\"background: #ccdbb2;\"><\u002Fdiv><div style=\"background: #aebf92;\"><\u002Fdiv><div style=\"background: #8fa073;\"><\u002Fdiv><div style=\"background: #728157;\"><\u002Fdiv><div style=\"background: #56633f;\"><\u002Fdiv><div style=\"background: #3d472b;\"><\u002Fdiv><div style=\"background: #272e1b;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px;\">\n            <span style=\"font-size: 12px;\">watch · accent<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(9, 1fr); height: 34px; border-radius: 999px; overflow: hidden;\">\n              <div style=\"background: #fff2eb;\"><\u002Fdiv><div style=\"background: #ffe1d0;\"><\u002Fdiv><div style=\"background: #ffc6a5;\"><\u002Fdiv><div style=\"background: #f6a06b;\"><\u002Fdiv><div style=\"background: #d67f48;\"><\u002Fdiv><div style=\"background: #b2622d;\"><\u002Fdiv><div style=\"background: #8c491a;\"><\u002Fdiv><div style=\"background: #643312;\"><\u002Fdiv><div style=\"background: #402310;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px;\">\n            <span style=\"font-size: 12px;\">alert · clay red<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(9, 1fr); height: 34px; border-radius: 999px; overflow: hidden;\">\n              <div style=\"background: #ffeeea;\"><\u002Fdiv><div style=\"background: #ffd7ce;\"><\u002Fdiv><div style=\"background: #f8b4a6;\"><\u002Fdiv><div style=\"background: #e98b78;\"><\u002Fdiv><div style=\"background: #d2604e;\"><\u002Fdiv><div style=\"background: #af4434;\"><\u002Fdiv><div style=\"background: #882e22;\"><\u002Fdiv><div style=\"background: #611e16;\"><\u002Fdiv><div style=\"background: #3e130e;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px;\">\n            <span style=\"font-size: 12px;\">stale · neutral<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(9, 1fr); height: 34px; border-radius: 999px; overflow: hidden;\">\n              <div style=\"background: #f9f4ed;\"><\u002Fdiv><div style=\"background: #eee7db;\"><\u002Fdiv><div style=\"background: #dcd3c4;\"><\u002Fdiv><div style=\"background: #c0b6a5;\"><\u002Fdiv><div style=\"background: #a19786;\"><\u002Fdiv><div style=\"background: #82796a;\"><\u002Fdiv><div style=\"background: #645c50;\"><\u002Fdiv><div style=\"background: #474238;\"><\u002Fdiv><div style=\"background: #2e2b25;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 12px; opacity: 0.6; margin-top: 14px; text-wrap: pretty;\">Rule: status is never colour alone. Every state also carries a glyph or a word — the compliance dot has a ring, the alert row has a label.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Heart-rate zones<\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">Five steps, cool to hot, anchored on the measured max of 194 bpm. Z2 is sage on purpose — Block 1's whole thesis was staying there.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <div style=\"display: grid; grid-template-columns: 30px 1fr 96px; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 999px; padding: 6px 16px 6px 6px;\">\n            <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: #7f9aa6; color: #fff; font-size: 12px; font-weight: 700;\">1<\u002Fspan>\n            <span style=\"font-size: 13px;\">Recovery <span style=\"opacity: 0.55;\">&lt; 116 bpm<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.6; text-align: right;\">#7f9aa6<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr 96px; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 999px; padding: 6px 16px 6px 6px;\">\n            <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: #8fa073; color: #fff; font-size: 12px; font-weight: 700;\">2<\u002Fspan>\n            <span style=\"font-size: 13px;\">Easy / aerobic <span style=\"opacity: 0.55;\">116–154 bpm<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.6; text-align: right;\">#8fa073<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr 96px; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 999px; padding: 6px 16px 6px 6px;\">\n            <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: #d9a441; color: #2e2b25; font-size: 12px; font-weight: 700;\">3<\u002Fspan>\n            <span style=\"font-size: 13px;\">Tempo <span style=\"opacity: 0.55;\">155–169 bpm<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.6; text-align: right;\">#d9a441<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr 96px; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 999px; padding: 6px 16px 6px 6px;\">\n            <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: #d67f48; color: #fff; font-size: 12px; font-weight: 700;\">4<\u002Fspan>\n            <span style=\"font-size: 13px;\">Threshold <span style=\"opacity: 0.55;\">170–182 bpm<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.6; text-align: right;\">#d67f48<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 30px 1fr 96px; align-items: center; gap: 12px; background: var(--color-surface); border-radius: 999px; padding: 6px 16px 6px 6px;\">\n            <span style=\"display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; background: #af4434; color: #fff; font-size: 12px; font-weight: 700;\">5<\u002Fspan>\n            <span style=\"font-size: 13px;\">VO₂max <span style=\"opacity: 0.55;\">&gt; 182 bpm<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.6; text-align: right;\">#af4434<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; margin-bottom: 48px;\">\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Series palette<\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">For charts carrying unrelated quantities. Five hues, distinguishable at 1,5 px stroke, ordered by how often they're needed.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;\">\n          <div><div style=\"height: 56px; border-radius: 16px; background: #c67139;\"><\u002Fdiv><div style=\"font-size: 11px; margin-top: 6px;\">01 load<br><span style=\"opacity: 0.55;\">#c67139<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height: 56px; border-radius: 16px; background: #7a8a5e;\"><\u002Fdiv><div style=\"font-size: 11px; margin-top: 6px;\">02 fitness<br><span style=\"opacity: 0.55;\">#7a8a5e<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height: 56px; border-radius: 16px; background: #5f7f8c;\"><\u002Fdiv><div style=\"font-size: 11px; margin-top: 6px;\">03 body<br><span style=\"opacity: 0.55;\">#5f7f8c<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height: 56px; border-radius: 16px; background: #d9a441;\"><\u002Fdiv><div style=\"font-size: 11px; margin-top: 6px;\">04 fuel<br><span style=\"opacity: 0.55;\">#d9a441<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"height: 56px; border-radius: 16px; background: #9b6a7d;\"><\u002Fdiv><div style=\"font-size: 11px; margin-top: 6px;\">05 sleep<br><span style=\"opacity: 0.55;\">#9b6a7d<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 12px; opacity: 0.6; margin-top: 14px; text-wrap: pretty;\">Planned values are always the same hue as their actual, drawn as a 4 2 dash at 55% opacity. Never a sixth colour.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Numerals &amp; formats<\u002Fh4>\n        <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px;\">Figtree with <code style=\"font-size: 12px;\">tabular-nums<\u002Fcode> for anything in a column. Caprasimo only for the one number a card is about.<\u002Fp>\n        <div style=\"background: var(--color-surface); border-radius: 28px; padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px;\">\n          <div>\n            <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 4px;\">Hero metric · Caprasimo 44<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-size: 44px; line-height: 1;\">18,2 <span style=\"font-size: 18px; opacity: 0.55;\">km<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 4px;\">Table figure · Figtree 700<\u002Fdiv>\n            <div style=\"font-size: 22px; font-weight: 700; line-height: 1.3;\">5:24 /km<br>152 bpm<br>0,74 L/h<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"grid-column: 1 / -1; border-top: 1px solid var(--color-divider); padding-top: 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 20px; font-size: 13px;\">\n            <span style=\"opacity: 0.6;\">Decimals<\u002Fspan><span>Komma — 44,8 km · 86,2 kg<\u002Fspan>\n            <span style=\"opacity: 0.6;\">Thousands<\u002Fspan><span>Punkt — 2.560 kcal<\u002Fspan>\n            <span style=\"opacity: 0.6;\">Dates<\u002Fspan><span>Fri, 31.07. · 2026-07-31 in tables<\u002Fspan>\n            <span style=\"opacity: 0.6;\">Weeks<\u002Fspan><span>CW31 · Block 3 · W19<\u002Fspan>\n            <span style=\"opacity: 0.6;\">Time<\u002Fspan><span>19:30 · 1:34:12 durations<\u002Fspan>\n            <span style=\"opacity: 0.6;\">Deltas<\u002Fspan><span>+0,4 / −7 with the sign always shown<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 16px;\">\n      <h4 style=\"font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;\">Density<\u002Fh4>\n      <p style=\"font-size: 13px; opacity: 0.65; margin-bottom: 14px; max-width: 72ch;\">Organic's default rhythm is airy; an analytical dashboard is not. Agon runs a compact scale inside cards and keeps Organic's generosity between them — air around the block, density within it.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;\">\n        <div style=\"background: var(--color-surface); border-radius: 24px; padding: 16px 20px;\">\n          <div style=\"font-size: 12px; font-weight: 700; margin-bottom: 6px;\">Row height 30px<\u002Fdiv>\n          <div style=\"font-size: 12px; opacity: 0.7;\">Tables and session lists. 12px type, 8px cell padding, hairline rules at 8% ink.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--color-surface); border-radius: 24px; padding: 16px 20px;\">\n          <div style=\"font-size: 12px; font-weight: 700; margin-bottom: 6px;\">Card gap 12px<\u002Fdiv>\n          <div style=\"font-size: 12px; opacity: 0.7;\">Inside a panel group. Between groups it opens to 26px (<code style=\"font-size: 11px;\">--space-6<\u002Fcode>).<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--color-surface); border-radius: 24px; padding: 16px 20px;\">\n          <div style=\"font-size: 12px; font-weight: 700; margin-bottom: 6px;\">Chart chrome<\u002Fdiv>\n          <div style=\"font-size: 12px; opacity: 0.7;\">Axis labels 10px at 55%, gridlines 8% ink, no frame, no legend box — labels sit on the series.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"type\" style=\"max-width: 1360px; margin: 0 auto; padding: 64px 40px 0; scroll-margin-top: 96px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-top: 2px solid var(--color-text); padding-top: 16px; margin-bottom: 32px;\">\n      <h2 style=\"font-size: 34px; margin: 0;\">Type<\u002Fh2>\n      <p style=\"margin: 0; font-size: 14px; opacity: 0.6; max-width: 56ch;\">Organic's pairing, held to three jobs — plus one addition the system doesn't carry and a data platform can't do without.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 32px;\">\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 22px 24px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 10px;\">Display · Caprasimo<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 56px; line-height: 1; letter-spacing: -0.02em; margin-bottom: 10px;\">44,8 km<\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.55; opacity: 0.75; margin: 0; text-wrap: pretty;\">Section headings and <strong>the one number a card is about<\u002Fstrong> — never two in the same card, never running text, never under 17px. It is the voice that says \"this is the answer\".<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 22px 24px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 10px;\">Interface · Figtree<\u002Fdiv>\n        <div style=\"font-size: 32px; font-weight: 700; line-height: 1.15; margin-bottom: 2px;\">5:24 /km · 148 bpm<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5; margin-bottom: 10px;\">Everything else: labels, prose, table figures.<\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.55; opacity: 0.75; margin: 0; text-wrap: pretty;\">400 for prose, 700 for any figure in a column. <code style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px;\">tabular-nums<\u002Fcode> is on globally — columns of numbers must align on the decimal, always.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 22px 24px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 10px;\">Identifiers · IBM Plex Mono <span style=\"color: var(--color-text); opacity: 0.5;\">added<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 20px; line-height: 1.5; margin-bottom: 10px;\">pnpm gh:sync<br>run_streams<br>2026-07-31<\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.55; opacity: 0.75; margin: 0; text-wrap: pretty;\">Organic has no mono and Agon is full of table names, commands, scopes and ISO dates. Scoped strictly to things you could type into a terminal — never for measurements, never for prose.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px;\">\n      <div style=\"background: var(--color-surface); border-radius: 28px; padding: 24px 26px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 18px;\">The scale<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-family: var(--font-heading); font-size: 44px; line-height: 1;\">Hero<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Caprasimo 44<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">the card's number<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-family: var(--font-heading); font-size: 34px; line-height: 1;\">Section<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Caprasimo 34<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">page sections<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-family: var(--font-heading); font-size: 24px; line-height: 1;\">Panel title<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Caprasimo 24<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">screens, dialogs<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-size: 22px; font-weight: 700;\">Figure 86,2<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Figtree 700 · 22<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">secondary metrics<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-size: 15px;\">Body — the paragraph size for prose and consulting answers.<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Figtree 15<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">reading<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-size: 13px;\">Dense — table cells, session rows, chips.<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Figtree 13<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">the grid<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--color-divider);\">\n            <span style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;\">Micro label<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Figtree 10 · 0,1em<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">card kickers<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 92px 120px; gap: 16px; align-items: baseline; padding: 12px 0;\">\n            <span style=\"font-size: 10px; opacity: 0.55;\">Axis 9 — chart labels only, never for anything a person must read twice.<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">Figtree 9<\u002Fspan>\n            <span style=\"font-size: 12px; opacity: 0.55;\">chart chrome<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"background: var(--color-surface); border-radius: 28px; padding: 22px 24px;\">\n          <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 12px;\">Rules that aren't negotiable<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 13px; line-height: 1.5;\">\n            <div style=\"text-wrap: pretty;\"><strong>One Caprasimo per card.<\u002Fstrong> Two display numbers in one card and neither is the answer.<\u002Fdiv>\n            <div style=\"text-wrap: pretty;\"><strong>Units are never display.<\u002Fstrong> The number is Caprasimo, the <span style=\"opacity: 0.55;\">km<\u002Fspan> beside it is Figtree at 40 % of its size, 50 % opacity.<\u002Fdiv>\n            <div style=\"text-wrap: pretty;\"><strong>Signs always show.<\u002Fstrong> +3,1 and −7, never a bare 3,1.<\u002Fdiv>\n            <div style=\"text-wrap: pretty;\"><strong>Uppercase only at 9–11px.<\u002Fstrong> Above that it shouts; Caprasimo already carries the emphasis.<\u002Fdiv>\n            <div style=\"text-wrap: pretty;\"><strong>Mono is for things you could type.<\u002Fstrong> A weight is not mono. A table name is.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #1c1916; color: #f3e8d6; border-radius: 28px; padding: 22px 24px;\">\n          <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #f6a06b; margin-bottom: 12px;\">On dark<\u002Fdiv>\n          <div style=\"font-family: var(--font-heading); font-size: 38px; line-height: 1; margin-bottom: 8px;\">18,2 <span style=\"font-family: var(--font-body); font-size: 15px; opacity: 0.5;\">km<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size: 13px; line-height: 1.55; opacity: 0.8; margin: 0; text-wrap: pretty;\">Caprasimo on the warm near-black drops one step of weight optically. Compensate with size, not with a heavier face — there isn't one.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"icons\" style=\"max-width: 1360px; margin: 0 auto; padding: 64px 40px 0; scroll-margin-top: 96px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; border-top: 2px solid var(--color-text); padding-top: 16px; margin-bottom: 32px;\">\n      <h2 style=\"font-size: 34px; margin: 0;\">Icons<\u002Fh2>\n      <p style=\"margin: 0; font-size: 14px; opacity: 0.6; max-width: 56ch;\">24 grid, 2,4 stroke, round caps and joins — Organic's heavier Lucide setting. Twenty-eight marks for the things Agon actually tracks; anything outside this set comes from Lucide unmodified.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--color-surface); border-radius: 32px; padding: 28px 30px; margin-bottom: 12px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 22px 12px;\">\n\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" style=\"width: 30px; height: 30px;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"15.5\" cy=\"4.8\" r=\"2\"><\u002Fcircle><path d=\"M9.5 21l3.2-5-2.7-3 1-4.6\"><\u002Fpath><path d=\"M13.5 9.2l3.6 1.6 1.4 3\"><\u002Fpath><path d=\"M13.2 16.4 16.8 20.4\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size: 11px; opacity: 0.6;\">run<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px;\">\n          <svg sc-camel-view-box=\"0 tyle=\"height: 12px; border-radius: 999px; background: #a19786; width: 60%;\"><\u002Fdiv><span style=\"text-align: right;\">Pull<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 46px; gap: 8px; align-items: center; font-size: 11px;\"><span style=\"opacity: 0.55;\">Thu<\u002Fspan><div style=\"height: 12px; border-radius: 999px; background: #d67f48; width: 68%;\"><\u002Fdiv><span style=\"text-align: right;\">12,4<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 46px; gap: 8px; align-items: center; font-size: 11px;\"><span style=\"opacity: 0.55;\">Fri<\u002Fspan><div style=\"height: 12px; border-radius: 999px; background: #8fa073; width: 100%;\"><\u002Fdiv><span style=\"text-align: right;\">18,2<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 46px; gap: 8px; align-items: center; font-size: 11px;\"><span style=\"opacity: 0.55;\">Sat<\u002Fspan><div style=\"height: 12px; border-radius: 999px; background: #a19786; width: 55%;\"><\u002Fdiv><span style=\"text-align: right;\">Legs<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 46px; gap: 8px; align-items: center; font-size: 11px;\"><span style=\"opacity: 0.55;\">Sun<\u002Fspan><div style=\"height: 12px; border-radius: 999px; background: #8fa073; width: 56%;\"><\u002Fdiv><span style=\"text-align: right;\">10,1<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #fff2eb; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8c491a; margin-bottom: 4px;\">What's off<\u002Fdiv>\n            <div style=\"font-size: 12px; line-height: 1.5; color: #643312; text-wrap: pretty;\">Z3 share at 26 % (target &lt; 15 %). Two long runs ended more than 2 % down on fluid.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: center; padding: 12px 0 4px;\">\n            <span style=\"display: inline-block; font-family: var(--font-heading); font-size: 13px; padding: 10px 22px; border-radius: 999px; background: #c67139; color: #f5ead8;\">Open the week in the dashboard<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 10px; opacity: 0.45; text-align: center; padding-top: 12px;\">Sent from the tower in Berlin · to you only<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6; margin-top: 10px;\">Weekly review — Mondays 06:00.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"background: #f9f4ed; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-md);\">\n          <div style=\"font-size: 11px; opacity: 0.5; padding-bottom: 12px; border-bottom: 1px solid var(--color-divider); margin-bottom: 16px;\">Agon &lt;bot@agon.local&gt; · Tue 03:12<br><span style=\"opacity: 0.8; color: var(--color-text);\">⚠ sleep_sessions empty for 6 days<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #ffeeea; border: 1px solid #f8b4a6; border-radius: 16px; padding: 18px 20px; margin-bottom: 14px;\">\n            <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n              <span style=\"width: 10px; height: 10px; border-radius: 999px; background: #af4434;\"><\u002Fspan>\n              <span style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #882e22;\">Pipeline alert<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-size: 22px; line-height: 1.2; color: #611e16; margin-bottom: 8px;\">Sleep data is not arriving.<\u002Fdiv>\n            <div style=\"font-size: 12px; line-height: 1.55; color: #882e22; text-wrap: pretty;\">The nightly <code style=\"font-size: 11px;\">dbt source freshness<\u002Fcode> run reports <code style=\"font-size: 11px;\">sleep_sessions<\u002Fcode> with no new row for 6 days. Google Health answers with a 403.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 8px;\">All sources<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;\">\n            <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid #eee7db;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #8fa073;\"><\u002Fspan><span>runs<\u002Fspan><span style=\"opacity: 0.55;\">2 h ago<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid #eee7db;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #8fa073;\"><\u002Fspan><span>hrv_daily<\u002Fspan><span style=\"opacity: 0.55;\">9 h ago<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid #eee7db;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #d9a441;\"><\u002Fspan><span>nutrition_days<\u002Fspan><span style=\"opacity: 0.55;\">3 d ago<\u002Fspan><\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; font-size: 12px;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #af4434;\"><\u002Fspan><span style=\"font-weight: 700;\">sleep_sessions<\u002Fspan><span style=\"color: #af4434;\">6 d ago<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #ebddc5; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 6px;\">Fix<\u002Fdiv>\n            <div style=\"font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 6px;\">pnpm gh:auth<\u002Fdiv>\n            <div style=\"font-size: 12px; line-height: 1.5; opacity: 0.75;\">Re-consent the <code style=\"font-size: 11px;\">googlehealth.sleep.readonly<\u002Fcode> scope, then <code style=\"font-size: 11px;\">pnpm gh:wellness --only=sleep<\u002Fcode>.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 10px; opacity: 0.45; text-align: center;\">This alert repeats daily until the source is fresh.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6; margin-top: 10px;\">Freshness alert — the dead-man's switch.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"background: #f9f4ed; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-md);\">\n          <div style=\"font-size: 11px; opacity: 0.5; padding-bottom: 12px; border-bottom: 1px solid var(--color-divider); margin-bottom: 16px;\">Agon &lt;bot@agon.local&gt; · Sun 20:00<br><span style=\"opacity: 0.8; color: var(--color-text);\">Block 2 complete — 8 weeks, 318 km<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #201e1d; color: #f3e8d6; border-radius: 16px; padding: 20px; margin-bottom: 12px; text-align: center;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #aebf92; margin-bottom: 8px;\">Block 2 · CW22–CW30<\u002Fdiv>\n            <div style=\"font-family: var(--font-heading); font-size: 30px; line-height: 1.1; margin-bottom: 6px;\">Eight weeks,<br>318 kilometres.<\u002Fdiv>\n            <div style=\"font-size: 12px; opacity: 0.6;\">Build intensity, introduce tempo running<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;\">\n            <div style=\"background: #ebddc5; border-radius: 14px; padding: 12px 14px;\"><div style=\"font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Ø week<\u002Fdiv><div style=\"font-family: var(--font-heading); font-size: 20px; line-height: 1.1;\">39,8 km<\u002Fdiv><div style=\"font-size: 10px; color: #56633f;\">Target 38–42 ✓<\u002Fdiv><\u002Fdiv>\n            <div style=\"background: #ebddc5; border-radius: 14px; padding: 12px 14px;\"><div style=\"font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">CTL<\u002Fdiv><div style=\"font-family: var(--font-heading); font-size: 20px; line-height: 1.1;\">48 → 59<\u002Fdiv><div style=\"font-size: 10px; color: #56633f;\">+11<\u002Fdiv><\u002Fdiv>\n            <div style=\"background: #ebddc5; border-radius: 14px; padding: 12px 14px;\"><div style=\"font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Weight<\u002Fdiv><div style=\"font-family: var(--font-heading); font-size: 20px; line-height: 1.1;\">88,1 → 86,4<\u002Fdiv><div style=\"font-size: 10px; color: #56633f;\">−1,7 kg<\u002Fdiv><\u002Fdiv>\n            <div style=\"background: #ebddc5; border-radius: 14px; padding: 12px 14px;\"><div style=\"font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;\">Compliance<\u002Fdiv><div style=\"font-family: var(--font-heading); font-size: 20px; line-height: 1.1;\">86 %<\u002Fdiv><div style=\"font-size: 10px; color: #8c491a;\">34 / 40 Sessions<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55; margin-bottom: 8px;\">Bests<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 12px;\">\n            <div style=\"display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid #eee7db;\"><span>Longest run<\u002Fspan><span style=\"font-weight: 700;\">18,2 km<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid #eee7db;\"><span>Fastest 5 km<\u002Fspan><span style=\"font-weight: 700;\">23:41<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span>Deadlift e1RM<\u002Fspan><span style=\"font-weight: 700;\">172 kg<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #f0fae1; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #56633f; margin-bottom: 4px;\">Next · block 3<\u002Fdiv>\n            <div style=\"font-size: 12px; line-height: 1.5; color: #3d472b; text-wrap: pretty;\">42–48 km/week, VO₂max every 10–14 days, long run out to 20 km. Window for the 10 km test: CW36.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: center;\">\n            <span style=\"display: inline-block; font-family: var(--font-heading); font-size: 13px; padding: 10px 22px; border-radius: 999px; background: #c67139; color: #f5ead8;\">View the block report<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 12px; opacity: 0.6; margin-top: 10px;\">Block completion — every eight weeks.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 56px; border-top: 1px solid var(--color-divider); padding-top: 20px; display: flex; justify-content: space-between; align-items: baseline;\">\n      <span style=\"font-family: var(--font-heading); font-size: 16px;\">Agon · Design system v0.1<\u002Fspan>\n      <span style=\"font-size: 12px; opacity: 0.5;\">Built on Organic · Berlin, August 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
