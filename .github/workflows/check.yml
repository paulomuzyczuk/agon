# The checks every change must pass, on every pull request and on main (MZY-6,
# docs/decisions/0001-engineering-rules-baseline.md). Node 22 matches .nvmrc.
# Actions are pinned to commit SHAs (tag in the comment) so a retagged release
# can't change what runs here.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MZY-396: no `KEY=   # comment` lines in .env.example (Compose reads the comment as the value).
      - run: sh scripts/check-env-example.sh
      # Every process.env.X the code reads is listed in .env.example (MZY-400).
      - run: pnpm check:env-keys
      # The example profile and program doc carry everything the real ones need (MZY-400).
      - run: pnpm check:examples
      - run: pnpm typecheck
      # Complexity over 10 is a warning. --max-warnings is the ratchet: 90 was the
      # count on 2026-10-08 (89 on 2026-10-15, 88 on 2026-10-29), and it may only go down. Lower it
      # when you fix one.
      - run: pnpm lint --max-warnings 88
      - run: pnpm budget:files
      - run: pnpm test
      # Not yet: 107 files fail Prettier today. Add this step back in the same
      # change as a one-off `pnpm format:write` commit.
      # - run: pnpm format:check
      # A high or critical advisory in production dependencies fails the build
      # (blocking since MZY-298 cleared the backlog). Fix by updating, or by an
      # override in pnpm-workspace.yaml; never by ignoring it.
      - run: pnpm audit --prod --audit-level high
